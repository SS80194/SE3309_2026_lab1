name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release gate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release gate: tag 指向的提交不在 main 的历史上，禁止发布"
            exit 1
          fi
          echo "Release gate: 通过"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Check formatting
        run: make fmt-check

      - name: Check code with vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build package
        env:
          TAG_NAME: ${{ github.ref_name }}
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION="${TAG_NAME#v}"
          make package VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$COMMIT_SHA"

      - name: Print checksums
        run: |
          sha256sum dist/*.tar.gz
          sha256sum dist/*.tar.gz.sha256

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --title "$TAG_NAME" \
            --notes "Release $TAG_NAME"
